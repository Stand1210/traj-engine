openapi: 3.0.3
info:
  title: Traj Engine Platform API
  version: 0.1.0
  description: |
    M0 contract for the agent trajectory quality platform.
    The frontend must call only this API and must not call Langfuse directly.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: tenants
  - name: ontologies
  - name: runs
  - name: results
  - name: reviews
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Get platform health
      responses:
        '200':
          description: Platform healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /config/profile:
    get:
      tags: [system]
      operationId: getCurrentProfile
      summary: Get effective deployment profile
      responses:
        '200':
          description: Effective profile without credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileInfo'
  /startup-records/current:
    get:
      tags: [system]
      operationId: getCurrentStartupRecord
      summary: Get the startup version check record
      responses:
        '200':
          description: Startup record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupRecord'
  /tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: List tenants
      parameters:
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Register a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenants/{tenantId}:
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Get tenant
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
  /ontologies:
    get:
      tags: [ontologies]
      operationId: listOntologies
      summary: List ontologies
      parameters:
        - name: tenantId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Ontology page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ontology'
    post:
      tags: [ontologies]
      operationId: createOntology
      summary: Create an ontology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyInput'
      responses:
        '201':
          description: Ontology created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
  /ontologies/{ontologyId}:
    get:
      tags: [ontologies]
      operationId: getOntology
      summary: Get ontology
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      responses:
        '200':
          description: Ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '404':
          $ref: '#/components/responses/NotFound'
  /ontologies/{ontologyId}/versions/current:
    get:
      tags: [ontologies]
      operationId: getCurrentOntologyVersion
      summary: Get the current immutable ontology version
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      responses:
        '200':
          description: Ontology version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /ontologies/{ontologyId}/versions:
    post:
      tags: [ontologies]
      operationId: publishOntologyVersion
      summary: Publish an immutable ontology version
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyVersionInput'
      responses:
        '201':
          description: Version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyVersion'
  /ontologies/{ontologyId}/prechecks:
    get:
      tags: [ontologies]
      operationId: listPrechecks
      summary: List adapter prechecks
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      responses:
        '200':
          description: Precheck page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Precheck'
    post:
      tags: [ontologies]
      operationId: createPrecheck
      summary: Run adapter precheck
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrecheckInput'
      responses:
        '202':
          description: Precheck accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Precheck'
  /ontologies/{ontologyId}/lifecycle:
    get:
      tags: [ontologies]
      operationId: getLifecycleSchedule
      summary: Get lifecycle schedule for an ontology
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      responses:
        '200':
          description: Lifecycle schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ontologies]
      operationId: configureLifecycleSchedule
      summary: Create or update lifecycle schedule
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleInput'
      responses:
        '200':
          description: Saved lifecycle schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '400':
          description: Invalid lifecycle configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /ontologies/{ontologyId}/lifecycle/evaluate:
    post:
      tags: [ontologies]
      operationId: evaluateLifecycle
      summary: Evaluate lifecycle and create an R1 or R2 run when due
      description: |
        The evaluator is idempotent for one evaluation window. R1 refreshes baselines
        with the active frozen structure; R2 creates a new structure version.
      parameters:
        - $ref: '#/components/parameters/ontologyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleEvaluateInput'
      responses:
        '201':
          description: Lifecycle evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEvaluation'
        '400':
          description: Lifecycle evaluation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /ontologies/{ontologyId}/lifecycle/evaluations:
    get:
      tags: [ontologies]
      operationId: listLifecycleEvaluations
      summary: List lifecycle evaluation history
      parameters:
        - $ref: '#/components/parameters/ontologyId'
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Lifecycle evaluation page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LifecycleEvaluation'
  /scheduler/status:
    get:
      tags: [system]
      operationId: getSchedulerStatus
      summary: Get lifecycle scheduler status
      responses:
        '200':
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
  /scheduler/evaluate-all:
    post:
      tags: [system]
      operationId: evaluateAllLifecycles
      summary: Run one lifecycle scheduler scan immediately
      description: |
        Executes the same scan as the background scheduler: run watchdog first,
        then evaluates every enabled lifecycle schedule. The singleton lease lock
        is respected, so this returns skipped when another scan is active.
      responses:
        '200':
          description: Scheduler scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerScanResult'
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - name: tenantId
          in: query
          schema: {type: string}
        - name: ontologyId
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/RunStatus'}
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Run page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Run'
    post:
      tags: [runs]
      operationId: createRun
      summary: Create a run
      description: |
        R1 refreshes baselines under a frozen structure.
        R2 creates a new structure version and requires a trigger reason.
        R3 is ontology version promotion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInput'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{runId}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a queued or running run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Run canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{runId}/steps:
    get:
      tags: [runs]
      operationId: listRunSteps
      summary: List run execution steps
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunStep'
  /runs/{runId}/cells:
    get:
      tags: [results]
      operationId: listCells
      summary: List clustering cells
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Cells
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cell'
  /runs/{runId}/traces:
    get:
      tags: [results]
      operationId: listTraceScores
      summary: List trace scores
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: cellId
          in: query
          schema: {type: string}
        - name: alertOnly
          in: query
          schema: {type: boolean}
        - name: abstainOnly
          in: query
          schema: {type: boolean}
        - name: minScore
          in: query
          schema: {type: number}
        - name: maxScore
          in: query
          schema: {type: number}
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Trace score page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TraceScore'
  /runs/{runId}/traces/{traceId}:
    get:
      tags: [results]
      operationId: getTraceScore
      summary: Get one trace score and evidence
      parameters:
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/traceId'
      responses:
        '200':
          description: Trace score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceScoreDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{runId}/alerts:
    get:
      tags: [results]
      operationId: listAlerts
      summary: List alert-ranked traces
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: budget
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertTraceScore'
  /runs/{runId}/alert-candidates:
    get:
      tags: [results]
      operationId: listAlertCandidates
      summary: List alerts suppressed by grouping or budget
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: budget
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Candidate and duplicate-suppressed alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertTraceScore'
  /runs/{runId}/alerts/summary:
    get:
      tags: [results]
      operationId: getAlertSummary
      summary: Get alert budget summary
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: budget
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100}
      responses:
        '200':
          description: Alert budget summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummary'
  /config/alerts:
    get:
      tags: [config]
      operationId: getAlertConfig
      summary: Get alert budget configuration
      responses:
        '200':
          description: Alert configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: integer}
                  budgetPerRun: {type: integer}
                  maxPerGroup: {type: integer}
                  weights: {type: object, additionalProperties: {type: number}}
  /runs/{runId}/lineage:
    get:
      tags: [results]
      operationId: getRunLineage
      summary: Get cell lineage for an R2 run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Lineage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineageEdge'
  /runs/{runId}/reviews:
    post:
      tags: [reviews]
      operationId: submitReview
      summary: Submit human review result
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List human reviews
      parameters:
        - name: tenantId
          in: query
          schema: {type: string}
        - name: runId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Review page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
  /runs/{runId}/review-queue:
    post:
      tags: [reviews]
      operationId: createReviewQueue
      summary: Push selected run scores to a Langfuse annotation queue
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewQueueInput'
      responses:
        '201':
          description: Queue items created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePushResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{runId}/review-queue/sync:
    post:
      tags: [reviews]
      operationId: syncReviewQueue
      summary: Import completed Langfuse annotations as human reviews
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueSyncResult'
        '400':
          description: Review queue not created
        '404':
          $ref: '#/components/responses/NotFound'
  /trace-scores/{traceScoreId}/evidence:
    get:
      tags: [results]
      operationId: listEvidence
      summary: List score evidence
      parameters:
        - name: traceScoreId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
  /runs/{runId}/calibration:
    get:
      tags: [results]
      operationId: getCalibration
      summary: Get calibration status for a run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Calibration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibration'
  /runs/{runId}/calibration/trigger:
    post:
      tags: [reviews]
      operationId: triggerReviewCalibration
      summary: Create a calibration version from human reviews
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationTriggerInput'
      responses:
        '201':
          description: Calibration version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCalibration'
        '400':
          description: Insufficient review labels
        '404':
          $ref: '#/components/responses/NotFound'
  /calibrations:
    get:
      tags: [reviews]
      operationId: listReviewCalibrations
      summary: List human-review calibration versions
      parameters:
        - name: tenantId
          in: query
          schema: {type: string}
        - name: runId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/pageLimit'
        - $ref: '#/components/parameters/pageCursor'
      responses:
        '200':
          description: Calibration page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewCalibration'
  /calibrations/{calibrationId}:
    get:
      tags: [reviews]
      operationId: getReviewCalibration
      summary: Get one human-review calibration version
      parameters:
        - name: calibrationId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Calibration version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCalibration'
        '404':
          $ref: '#/components/responses/NotFound'
  /calibrations/{calibrationId}/activate:
    post:
      tags: [reviews]
      operationId: activateReviewCalibration
      summary: Activate a calibration version for its tenant
      parameters:
        - name: calibrationId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Calibration activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCalibration'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: {type: string}
    ontologyId:
      name: ontologyId
      in: path
      required: true
      schema: {type: string}
    runId:
      name: runId
      in: path
      required: true
      schema: {type: string}
    traceId:
      name: traceId
      in: path
      required: true
      schema: {type: string}
    pageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    pageCursor:
      name: cursor
      in: query
      schema: {type: string}
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {}
        page:
          type: object
          properties:
            nextCursor: {type: string, nullable: true}
            limit: {type: integer}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
    ProfileInfo:
      type: object
      required: [profile]
      properties:
        profile: {type: string, enum: [cloud-v4, selfhosted-v4]}
        baseUrl: {type: string}
        versionConstraint: {type: string}
    StartupRecord:
      type: object
      required: [id, profile, checkedAt, skipped]
      properties:
        id: {type: string}
        profile: {type: string}
        profileHash: {type: string}
        langfuseVersion: {type: string}
        checkedAt: {type: string, format: date-time}
        skipped: {type: boolean}
    Tenant:
      type: object
      required: [id, orgId, projectId, displayName, createdAt]
      properties:
        id: {type: string}
        orgId: {type: string}
        projectId: {type: string}
        queueId: {type: string}
        displayName: {type: string}
        createdAt: {type: string, format: date-time}
    TenantInput:
      type: object
      required: [orgId, projectId, displayName, publicKey, secretKey]
      properties:
        orgId: {type: string}
        projectId: {type: string}
        queueId: {type: string}
        displayName: {type: string}
        publicKey: {type: string, writeOnly: true}
        secretKey: {type: string, writeOnly: true}
    Ontology:
      type: object
      required: [id, tenantId, currentVersion, tier]
      properties:
        id: {type: string}
        tenantId: {type: string}
        currentVersion: {type: integer}
        tier: {type: string, enum: [tier0, tier1]}
        createdAt: {type: string, format: date-time}
    OntologyInput:
      type: object
      required: [tenantId, tier]
      properties:
        tenantId: {type: string}
        tier: {type: string, enum: [tier0, tier1]}
        displayName: {type: string}
    OntologyVersion:
      type: object
      required: [ontologyId, version, yaml, codeHash, createdAt]
      properties:
        ontologyId: {type: string}
        version: {type: integer}
        yaml: {type: string}
        codeHash: {type: string}
        createdAt: {type: string, format: date-time}
    OntologyVersionInput:
      type: object
      required: [yaml]
      properties:
        yaml: {type: string}
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    RunType:
      type: string
      enum: [R1, R2, R3]
    SourceType:
      type: string
      enum: [jsonl, langfuse]
    Run:
      type: object
      required: [id, tenantId, ontologyId, runType, source, status, createdAt]
      properties:
        id: {type: string}
        tenantId: {type: string}
        ontologyId: {type: string}
        ontologyVersion: {type: integer}
        parentRunId: {type: string, nullable: true}
        runType: {$ref: '#/components/schemas/RunType'}
        source: {$ref: '#/components/schemas/SourceType'}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        samplingRate: {type: number}
        status: {$ref: '#/components/schemas/RunStatus'}
        structureVersion: {type: string}
        anchorVersion: {type: string}
        codeHash: {type: string}
        error: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
    RunInput:
      type: object
      required: [tenantId, ontologyId, runType, source, windowStart, windowEnd]
      properties:
        tenantId: {type: string}
        ontologyId: {type: string}
        sourceRef: {type: string}
        limit: {type: integer, minimum: 1}
        runType: {$ref: '#/components/schemas/RunType'}
        source: {$ref: '#/components/schemas/SourceType'}
        sourceRef: {type: string}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        samplingRate: {type: number, minimum: 0, maximum: 1}
        writebackToLangfuse: {type: boolean, default: false}
        writebackStrict: {type: boolean, default: false}
        parentRunId: {type: string}
        triggerReason: {type: string}
        idempotencyKey: {type: string}
    RunStep:
      type: object
      required: [id, runId, name, status, startedAt]
      properties:
        id: {type: string}
        runId: {type: string}
        name: {type: string}
        status: {type: string, enum: [running, succeeded, failed, skipped]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        payload: {type: object, additionalProperties: true}
    Cell:
      type: object
      required: [id, runId, structureVersion, cellKey, size]
      properties:
        id: {type: string}
        runId: {type: string}
        structureVersion: {type: string}
        cellKey: {type: string}
        label: {type: string}
        size: {type: integer}
        parentId: {type: string, nullable: true}
        dominantAction: {type: string}
        metrics: {type: object, additionalProperties: true}
    TraceScore:
      type: object
      required: [id, runId, traceId, totalScore, isAlert, isAbstain]
      properties:
        id: {type: string}
        runId: {type: string}
        traceId: {type: string}
        cellId: {type: string, nullable: true}
        totalScore: {type: number}
        resultScore: {type: number}
        processScore: {type: number}
        latencyScore: {type: number}
        costScore: {type: number}
        robustnessScore: {type: number}
        isAlert: {type: boolean}
        isAbstain: {type: boolean}
        structureVersion: {type: string}
        ontologyVersion: {type: integer}
        codeHash: {type: string}
    TraceScoreDetail:
      allOf:
        - $ref: '#/components/schemas/TraceScore'
        - type: object
          properties:
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/Evidence'
    AlertTraceScore:
      allOf:
        - $ref: '#/components/schemas/TraceScore'
        - type: object
          required: [alertStatus, priority, priorityRank, groupKey, groupRank, groupSize, cause, causeKind]
          properties:
            alertStatus: {type: string, enum: [alerted, candidate, suppressed_duplicate]}
            priority: {type: number}
            priorityRank: {type: integer}
            groupKey: {type: string}
            groupRank: {type: integer}
            groupSize: {type: integer}
            cause: {type: string}
            causeKind: {type: string}
            reasons:
              type: array
              items: {type: string}
    AlertSummary:
      type: object
      required: [budget, totalAlerts, groups, emitted, candidates, statusCounts, topGroups]
      properties:
        budget: {type: integer}
        totalAlerts: {type: integer}
        groups: {type: integer}
        emitted: {type: integer}
        candidates: {type: integer}
        statusCounts:
          type: object
          required: [alerted, candidate, suppressed_duplicate]
          properties:
            alerted: {type: integer}
            candidate: {type: integer}
            suppressed_duplicate: {type: integer}
        topGroups:
          type: array
          items:
            type: object
            properties:
              groupKey: {type: string}
              cause: {type: string}
              causeKind: {type: string}
              groupSize: {type: integer}
              topPriority: {type: number}
              status: {type: string}
    Evidence:
      type: object
      required: [id, dimension, contribution, explanation]
      properties:
        id: {type: string}
        traceScoreId: {type: string}
        dimension: {type: string, enum: [result, process, latency, cost, robustness]}
        spanId: {type: string, nullable: true}
        contribution: {type: number}
        explanation: {type: string}
        payload: {type: object, additionalProperties: true}
    LineageEdge:
      type: object
      required:
        - id
        - runId
        - oldCellId
        - newCellId
        - relation
        - overlap
        - createdAt
      properties:
        id: {type: string}
        runId: {type: string}
        oldCellId: {type: string}
        newCellId: {type: string}
        relation: {type: string, enum: [continued, split, merged, born, died]}
        overlap: {type: number}
        oldCellKey: {type: string, nullable: true}
        newCellKey: {type: string, nullable: true}
        oldCellSize: {type: integer, nullable: true}
        newCellSize: {type: integer, nullable: true}
        createdAt: {type: string, format: date-time}
    Review:
      type: object
      required: [id, traceScoreId, verdict, createdAt]
      properties:
        id: {type: string}
        traceScoreId: {type: string}
        reviewer: {type: string}
        verdict: {type: string, enum: [agree, disagree, uncertain]}
        label: {type: string}
        comment: {type: string}
        createdAt: {type: string, format: date-time}
    ReviewInput:
      type: object
      required: [traceScoreId, verdict]
      properties:
        traceScoreId: {type: string}
        reviewer: {type: string}
        verdict: {type: string, enum: [agree, disagree, uncertain]}
        label: {type: string}
        comment: {type: string}
    ReviewQueueInput:
      type: object
      properties:
        scope: {type: string, enum: [alerts, abstains, all], default: all}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}
        queueName: {type: string, default: traj-engine-review}
    CalibrationTriggerInput:
      type: object
      required: [createdBy]
      properties:
        createdBy: {type: string, minLength: 1, maxLength: 120}
    ReviewCalibration:
      type: object
      required:
        - id
        - tenantId
        - sourceRunId
        - labelCount
        - traceCount
        - alertReviewed
        - metrics
        - parameters
        - codeHash
        - createdBy
        - createdAt
      properties:
        id: {type: string}
        tenantId: {type: string}
        sourceRunId: {type: string}
        labelCount: {type: integer}
        traceCount: {type: integer}
        verdictCounts:
          type: object
          additionalProperties: {type: integer}
        alertReviewed: {type: integer}
        alertAgree: {type: integer}
        alertDisagree: {type: integer}
        alertPrecision: {type: number, nullable: true}
        ece: {type: number, nullable: true}
        brier: {type: number, nullable: true}
        metrics: {type: object, additionalProperties: true}
        parameters: {type: object, additionalProperties: true}
        codeHash: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        activatedAt: {type: string, format: date-time, nullable: true}
    ReviewQueuePushResult:
      type: object
      required: [runId, queueId, scope, selected, pushed, items]
      properties:
        runId: {type: string}
        queueId: {type: string}
        scope: {type: string}
        selected: {type: integer}
        pushed: {type: integer}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              traceScoreId: {type: string}
              traceId: {type: string}
              itemId: {type: string}
              status: {type: string}
    ReviewQueueSyncResult:
      type: object
      required: [runId, queueId, statusUpdates, awaitingReview, imported]
      properties:
        runId: {type: string}
        queueId: {type: string}
        statusUpdates: {type: integer}
        awaitingReview: {type: integer}
        imported: {type: integer}
    Precheck:
      type: object
      required: [id, ontologyId, status, createdAt]
      properties:
        id: {type: string}
        ontologyId: {type: string}
        status: {type: string, enum: [running, passed, warning, failed]}
        report: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
    PrecheckInput:
      type: object
      required: [sampleSize]
      properties:
        sampleSize: {type: integer, minimum: 100}
    LifecycleSchedule:
      type: object
      required:
        - id
        - ontologyId
        - enabled
        - source
        - sourceRef
        - intervalHours
        - windowHours
        - samplingRate
        - r2NoveltyThreshold
        - r2MinNoveltyTraces
        - r2AlertRateThreshold
        - writebackToLangfuse
        - createdAt
        - updatedAt
      properties:
        id: {type: string}
        ontologyId: {type: string}
        enabled: {type: boolean}
        source: {type: string, enum: [jsonl, langfuse]}
        sourceRef: {type: string}
        intervalHours: {type: number, exclusiveMinimum: 0}
        windowHours: {type: number, exclusiveMinimum: 0}
        samplingRate: {type: number, exclusiveMinimum: 0, maximum: 1}
        maxTraces: {type: integer, minimum: 1, nullable: true}
        r2NoveltyThreshold: {type: number, minimum: 0, maximum: 1}
        r2MinNoveltyTraces: {type: integer, minimum: 0, default: 50}
        r2AlertRateThreshold: {type: number, minimum: 0, maximum: 1}
        writebackToLangfuse: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LifecycleInput:
      type: object
      properties:
        enabled: {type: boolean, default: true}
        source: {type: string, enum: [jsonl, langfuse], default: langfuse}
        sourceRef: {type: string, minLength: 1, maxLength: 120, default: lifecycle}
        intervalHours: {type: number, exclusiveMinimum: 0, default: 24}
        windowHours: {type: number, exclusiveMinimum: 0, default: 24}
        samplingRate: {type: number, exclusiveMinimum: 0, maximum: 1, default: 1}
        maxTraces: {type: integer, minimum: 1, nullable: true}
        r2NoveltyThreshold: {type: number, minimum: 0, maximum: 1, default: 0.15}
        r2MinNoveltyTraces: {type: integer, minimum: 0, default: 50}
        r2AlertRateThreshold: {type: number, minimum: 0, maximum: 1, default: 0.20}
        writebackToLangfuse: {type: boolean, default: false}
    LifecycleEvaluateInput:
      type: object
      properties:
        forceR2: {type: boolean, default: false}
    LifecycleEvaluation:
      type: object
      required: [id, ontologyId, decision, reason, metrics, createdAt]
      properties:
        id: {type: string}
        ontologyId: {type: string}
        decision:
          type: string
          enum: [skipped, created_r1, created_r2]
        reason:
          type: string
          enum:
            - schedule_disabled
            - run_in_progress
            - cold_start
            - forced_r2
            - novelty_threshold
            - novelty_below_minimum
            - alert_rate_threshold
            - interval_due
            - not_due
        metrics: {type: object, additionalProperties: true}
        createdRunId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        run:
          allOf:
            - $ref: '#/components/schemas/Run'
          nullable: true
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        evaluationBucket: {type: string, format: date-time}
    SchedulerLock:
      type: object
      required: [id, ownerId, acquiredAt, expiresAt]
      properties:
        id: {type: string}
        ownerId: {type: string}
        acquiredAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    SchedulerLatestScan:
      type: object
      required:
        - id
        - status
        - startedAt
        - watchdogFailedRuns
        - evaluationCount
        - createdRunCount
        - result
      properties:
        id: {type: string}
        status: {type: string, enum: [running, succeeded, failed]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        watchdogFailedRuns: {type: integer}
        evaluationCount: {type: integer}
        createdRunCount: {type: integer}
        result:
          type: object
          additionalProperties: true
        error: {type: string, nullable: true}
    SchedulerStatus:
      type: object
      required: [enabledSchedules]
      properties:
        lock:
          allOf:
            - $ref: '#/components/schemas/SchedulerLock'
          nullable: true
        enabledSchedules: {type: integer}
        latestScan:
          allOf:
            - $ref: '#/components/schemas/SchedulerLatestScan'
          nullable: true
    SchedulerScanResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [succeeded, failed, skipped]}
        scanId: {type: string}
        reason: {type: string}
        error: {type: string}
        watchdogFailedRuns:
          type: array
          items: {type: string}
        evaluations:
          type: array
          items:
            type: object
            properties:
              ontologyId: {type: string}
              decision: {type: string}
              reason: {type: string}
              runId: {type: string, nullable: true}
        lock:
          allOf:
            - $ref: '#/components/schemas/SchedulerLock'
          nullable: true
    Calibration:
      type: object
      required: [runId, kind]
      properties:
        runId: {type: string}
        kind: {type: string, enum: [none, isotonic, Platt]}
        labelCount: {type: integer, nullable: true}
        ece: {type: number, nullable: true}
        metrics: {type: object, additionalProperties: true}
