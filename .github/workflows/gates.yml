name: gates

# Fast tier: every push and every PR. Each step below is either platform-independent or states
# the platform assumption it is making. The expensive full-matrix reproducibility run lives in
# matrix.yml, which only fires on code/data changes, weekly, and on demand.
#
# The kernel and benchmark remain pure standard library (no numpy/scipy/sklearn), which is what
# keeps the deterministic reproducibility claim auditable without a solver stack. The M1 platform
# service is the one exception and installs the pinned web stack from requirements.txt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  # Keeps __pycache__ out of the checkout so the final `git diff --exit-code` means what it says.
  PYTHONDONTWRITEBYTECODE: "1"
  # PYTHONHASHSEED is deliberately NOT pinned. The default is a random per-process seed, so if any
  # code path ever starts depending on str hash ordering this workflow fails loudly instead of
  # being silently frozen into determinism by the CI environment. Measured as of this writing:
  # there are no bare hash() calls in kernel/, bench/ or ontology/, every set() is wrapped in
  # sorted(), and every glob()/os.listdir() is sorted too.

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest produced the committed baseline, so it is the leg that can assert
          # byte-identity outright.
          - os: windows-latest
            repro: --sample
          # ubuntu-latest is a different libc. IEEE-754 does not require exp/log/erf/erfc/pow to
          # be correctly rounded, and this codebase uses math.log 17x, math.exp 7x, math.erfc 1x
          # and ** 107x. So this leg runs the same check in portable mode: sha256 is still tried
          # first, and only on a byte mismatch does it fall back to a structural comparison that
          # prints the worst relative deviation it actually saw. A printed deviation of 0.0 means
          # the platform is bit-reproducible after all and the tolerance was never used.
          - os: ubuntu-latest
            repro: --sample --numeric-tol 1e-12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Environment
        run: |
          python -VV
          uname -srm
          nproc
          echo "git core.autocrlf = $(git config --get core.autocrlf || echo unset)"
          echo "kernel dependencies: none; platform dependencies: requirements.txt"

      - name: Install platform dependencies
        run: python -m pip install --requirement requirements.txt

      - name: "Gate 1/7 - platform contracts"
        run: |
          python -m compileall -q platform
          python -m unittest discover -s platform/tests -v
          python -c "from platform.app.service import app; assert app.title == 'Traj Engine Platform API'"
          python - <<'PY'
          import pathlib
          import re
          import sqlite3
          import yaml

          yaml_files = [
              "platform/contracts/openapi.yaml",
              "platform/config/endpoints.yaml",
              "platform/config/profiles/cloud-v4.yaml",
              "platform/config/profiles/selfhosted-v4.yaml",
              "platform/config/calibration.yaml",
              "platform/config/scheduler.yaml",
          ]
          for name in yaml_files:
              yaml.safe_load(pathlib.Path(name).read_text(encoding="utf-8"))

          connection = sqlite3.connect(":memory:")
          connection.executescript(
              pathlib.Path("platform/contracts/schema.sql").read_text(encoding="utf-8")
          )
          tables = connection.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()
          assert len(tables) == 22, tables

          spec = yaml.safe_load(
              pathlib.Path("platform/contracts/openapi.yaml").read_text(encoding="utf-8")
          )
          text = pathlib.Path("platform/contracts/openapi.yaml").read_text(encoding="utf-8")
          refs = set(re.findall(r"\$ref: '([^']+)'", text))
          for ref in refs:
              current = spec
              for part in ref[2:].split("/"):
                  assert part in current, ref
                  current = current[part]
          print(f"platform contracts OK: {len(yaml_files)} YAML files, {len(tables)} tables, {len(refs)} refs")
          PY

      - name: "Gate 2/7 - frontend build"
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 12 mathematical properties of the scoring / clustering / calibration machinery, asserted on
      # synthetic inputs with no ground truth and no labels. ~10s. These are what let the kernel be
      # called a standard engineering artefact rather than a fit to one business.
      - name: "Gate 3/7 - invariants"
        run: python -m bench.invariants

      # Re-runs bench.generate for all 8 regimes into a scratch dir and compares against the
      # committed 240 MB, then regenerates all 8 SAMPLE.md in place and compares. Catches
      # truncation, CRLF conversion, a BOM, an edited record, and a stale dataset -- none of which
      # spec_hash provenance can see, because spec_hash hashes the regime spec, not the bytes.
      # ~53s on the dev box.
      - name: "Gate 4/7 - regeneration identity"
        run: python -m bench.reprocheck ${{ matrix.repro }}

      # Appendix-A 77-feature contract audit, 8 fidelity checks, 13-feature differential against
      # an independent probe, label/truth/feature agreement over all 22,800 traces, and dataset
      # provenance. Exits non-zero on any blocker, fidelity failure or stale regime.
      - name: "Gate 5/7 - coverage / contract / fidelity audit"
        run: python -m bench.coverage --md

      # Three-hop reconciliation: README <-> reports/*/metrics.json cell by cell (wall clock
      # masked), metrics.spec_hash <-> data/*/meta.json.spec_hash, and metrics.code_hash <-> the
      # live kernel/ontology/bench closure hash. Catches "kernel edited, runner not re-run", which
      # the hop above cannot see.
      - name: "Gate 6/7 - scorecard three-hop reconciliation"
        run: python -m bench.scorecard --check

      # Regenerate every derived document and assert the tree is still clean. This is the check
      # that makes hand-editing README.md or COVERAGE.md pointless: the next push rewrites them.
      - name: "Gate 7/7 - no derived-document drift"
        run: |
          python -m bench.scorecard
          git --no-pager diff --stat
          git diff --exit-code
          echo "OK: README.md, COVERAGE.md and SAMPLE.md are byte-identical after regeneration"
